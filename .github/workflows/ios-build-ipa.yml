name: iOS 16.1.1 (iPhone XS Max) Build & Unsigned IPA CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "tools/verify-ios-parity.py"
      - "tools/bump-ios-version.py"
      - ".github/workflows/ios-build-ipa.yml"
  pull_request:
    paths:
      - "apps/**"
      - "tools/verify-ios-parity.py"
      - "tools/bump-ios-version.py"
      - ".github/workflows/ios-build-ipa.yml"
  workflow_dispatch:
    inputs:
      app_slug:
        description: "Specific app slug under apps/ (leave empty to build all apps)"
        required: false
        default: ""
        type: string
      configuration:
        description: "Xcode build configuration"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      run_simulator_tests:
        description: "Run XCTest suite on iOS Simulator before packaging IPA"
        required: false
        default: true
        type: boolean
      strip_extensions:
        description: "Strip PlugIns/*.appex (enable for Free Apple ID Sideloadly/AltStore; keep false for TrollStore 2)"
        required: false
        default: false
        type: boolean
      skip_parity_gate:
        description: "Bypass Stage-1/citation parity gate (ONLY for early scaffold smoke-builds)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: "ios-build-ipa-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  discover:
    name: Discover iOS App Targets
    runs-on: ubuntu-24.04
    outputs:
      has_apps: ${{ steps.find.outputs.has_apps }}
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Discover apps/*/ios-app/project.yml targets
        id: find
        env:
          INPUT_SLUG: ${{ inputs.app_slug }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys

          root = pathlib.Path("apps")
          requested = (os.environ.get("INPUT_SLUG") or "").strip()
          slugs = []

          if requested:
              spec = root / requested / "ios-app" / "project.yml"
              if not spec.is_file():
                  print(f"::error::Requested app_slug '{requested}' has no XcodeGen spec at {spec}")
                  sys.exit(1)
              slugs = [requested]
          elif root.is_dir():
              for spec in sorted(root.glob("*/ios-app/project.yml")):
                  slugs.append(spec.parent.parent.name)

          has_apps = "true" if slugs else "false"
          matrix = {"slug": slugs}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_apps={has_apps}\n")
              fh.write(f"matrix={json.dumps(matrix)}\n")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sf:
                  if slugs:
                      sf.write(f"### Discovered iOS 16.1.1 Build Targets\n- " + "\n- ".join(f"`{s}`" for s in slugs) + "\n")
                  else:
                      sf.write("### No iOS App Targets Found Yet\nAdd an app via `python3 tools/new-ios-app.py <slug> <decrypted.ipa> \"<Display Name>\"` to trigger automatic `.ipa` builds.\n")
          print(f"Discovered {len(slugs)} iOS target(s): {slugs}")
          PY

  build-ipa:
    name: Build & Package IPA (${{ matrix.slug }})
    needs: discover
    if: needs.discover.outputs.has_apps == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run iOS 16.1.1 Parity Gate
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_parity_gate }}
        env:
          APP_SLUG: ${{ matrix.slug }}
        run: |
          python3 tools/verify-ios-parity.py "$APP_SLUG" --ci

      - name: Auto-Increment Rebuild Version for CI Run
        id: ver
        env:
          APP_SLUG: ${{ matrix.slug }}
        run: |
          python3 tools/bump-ios-version.py "$APP_SLUG" \
            --ci-run "${GITHUB_RUN_NUMBER:-1}" \
            --ci-attempt "${GITHUB_RUN_ATTEMPT:-1}" \
            --no-manifest \
            --github-output "$GITHUB_OUTPUT"

      - name: Inspect Xcode toolchain & install XcodeGen
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project from project.yml
        id: gen
        env:
          APP_SLUG: ${{ matrix.slug }}
        run: |
          IOS_DIR="apps/${APP_SLUG}/ios-app"
          xcodegen generate --spec "${IOS_DIR}/project.yml" --project "${IOS_DIR}"
          python3 - <<'PY'
          import os, pathlib, re, sys

          ios_dir = pathlib.Path("apps") / os.environ["APP_SLUG"] / "ios-app"
          yml_txt = (ios_dir / "project.yml").read_text(encoding="utf-8")
          m = re.search(r"^\s*name\s*:\s*['\"]?([A-Za-z0-9_.-]+)['\"]?", yml_txt, re.M)
          if not m:
              print("::error::Could not determine project name from project.yml")
              sys.exit(1)
          proj_name = m.group(1)
          xcodeproj = ios_dir / f"{proj_name}.xcodeproj"
          if not xcodeproj.is_dir():
              found = sorted(ios_dir.glob("*.xcodeproj"))
              if not found:
                  print(f"::error::No .xcodeproj generated inside {ios_dir}")
                  sys.exit(1)
              xcodeproj = found[0]
              proj_name = xcodeproj.stem

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"ios_dir={ios_dir}\n")
              fh.write(f"project_name={proj_name}\n")
              fh.write(f"xcodeproj={xcodeproj}\n")
          print(f"Generated {xcodeproj} (scheme: {proj_name})")
          PY

      - name: Run XCTest suite on iOS Simulator
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_simulator_tests }}
        env:
          IOS_DIR: ${{ steps.gen.outputs.ios_dir }}
          XCODEPROJ: ${{ steps.gen.outputs.xcodeproj }}
          SCHEME: ${{ steps.gen.outputs.project_name }}
        run: |
          rm -rf "${IOS_DIR}/sim-build"
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys

          ios_dir = os.environ["IOS_DIR"]
          xcodeproj = os.environ["XCODEPROJ"]
          scheme = os.environ["SCHEME"]

          list_proc = subprocess.run(
              ["xcodebuild", "-list", "-json", "-project", xcodeproj],
              capture_output=True, text=True, check=True,
          )
          proj_info = json.loads(list_proc.stdout).get("project", {})
          targets = proj_info.get("targets", [])
          has_tests = any(t.endswith("Tests") for t in targets)
          if not has_tests:
              print("No *Tests target found; skipping Simulator XCTest step.")
              sys.exit(0)

          sim_proc = subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              capture_output=True, text=True, check=True,
          )
          devices_by_rt = json.loads(sim_proc.stdout).get("devices", {})
          candidates = []
          for rt, devs in devices_by_rt.items():
              if "iOS" not in rt:
                  continue
              for d in devs:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      name = d["name"]
                      prio = 0
                      if "XS Max" in name:
                          prio = 100
                      elif "Plus" in name or "Max" in name:
                          prio = 80
                      else:
                          prio = 50
                      candidates.append((prio, rt, name, d["udid"]))

          if not candidates:
              print("::warning::No available iPhone Simulator runtime found on runner; skipping tests.")
              sys.exit(0)

          candidates.sort(key=lambda x: (x[0], x[1]), reverse=True)
          _, rt, name, udid = candidates[0]
          sim_dd = str(pathlib.Path(ios_dir).resolve() / "sim-build")
          print(f"Running XCTests on Simulator: {name} ({rt}, id={udid})")
          cmd = [
              "xcodebuild",
              "-project", xcodeproj,
              "-scheme", scheme,
              "-destination", f"platform=iOS Simulator,id={udid}",
              "-derivedDataPath", sim_dd,
              "CODE_SIGNING_ALLOWED=NO",
              "CODE_SIGNING_REQUIRED=NO",
              "CODE_SIGN_IDENTITY=",
              "AD_HOC_CODE_SIGNING_ALLOWED=NO",
              "test",
          ]
          res = subprocess.run(cmd)
          sys.exit(res.returncode)
          PY
          rm -rf "${IOS_DIR}/sim-build"

      - name: Build ARM64 iOS Device App (Unsigned iphoneos)
        env:
          IOS_DIR: ${{ steps.gen.outputs.ios_dir }}
          XCODEPROJ: ${{ steps.gen.outputs.xcodeproj }}
          SCHEME: ${{ steps.gen.outputs.project_name }}
          BUILD_CONFIG: ${{ inputs.configuration || 'Release' }}
        run: |
          rm -rf "${IOS_DIR}/build"
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration "$BUILD_CONFIG" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$PWD/${IOS_DIR}/build" \
            build

      - name: Package & Ad-Hoc Sign IPA for iOS 16.1.1 (TrollStore 2 / Sideloadly / AltStore)
        id: pkg
        env:
          APP_SLUG: ${{ matrix.slug }}
          IOS_DIR: ${{ steps.gen.outputs.ios_dir }}
          BUILD_CONFIG: ${{ inputs.configuration || 'Release' }}
          STRIP_EXT: ${{ inputs.strip_extensions == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          PRODUCTS_DIR="${IOS_DIR}/build/Build/Products/${BUILD_CONFIG}-iphoneos"
          APP_PATH="$(find "$PRODUCTS_DIR" -maxdepth 1 -name '*.app' ! -name '*Runner.app' -print -quit)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Built .app bundle not found in ${PRODUCTS_DIR}"
            exit 1
          fi
          APP_BASENAME="$(basename "$APP_PATH")"
          STAGE_DIR="$PWD/dist-ipa/${APP_SLUG}-staging"
          OUT_DIR="$PWD/dist-ipa"
          IPA_NAME="${APP_SLUG}-ios16.1.1-arm64.ipa"
          IPA_PATH="${OUT_DIR}/${IPA_NAME}"

          rm -rf "$STAGE_DIR" "$IPA_PATH"
          mkdir -p "${STAGE_DIR}/Payload"
          cp -R "$APP_PATH" "${STAGE_DIR}/Payload/${APP_BASENAME}"

          STAGED_APP="${STAGE_DIR}/Payload/${APP_BASENAME}"
          if [ "$STRIP_EXT" = "true" ] && [ -d "${STAGED_APP}/PlugIns" ]; then
            echo "Stripping PlugIns/*.appex for Free Apple ID Sideloadly/AltStore compatibility"
            rm -rf "${STAGED_APP}/PlugIns"
          fi

          # Remove stale signatures and provisioning profiles
          find "$STAGED_APP" -name "_CodeSignature" -type d -exec rm -rf {} +
          find "$STAGED_APP" -name "embedded.mobileprovision" -type f -delete

          # Inside-out ad-hoc codesign (preserves entitlements for TrollStore 2 and stays re-signable by Sideloadly/AltStore)
          if [ -d "${STAGED_APP}/Frameworks" ]; then
            find "${STAGED_APP}/Frameworks" -maxdepth 2 \( -name "*.dylib" -o -name "*.framework" \) | while read -r fw; do
              codesign --force --sign - --timestamp=none "$fw"
            done
          fi
          if [ -d "${STAGED_APP}/PlugIns" ]; then
            find "${STAGED_APP}/PlugIns" -maxdepth 1 -name "*.appex" | while read -r ext; do
              codesign --force --sign - --timestamp=none "$ext"
            done
          fi

          ENT_FILE="${IOS_DIR}/Sources/Resources/Entitlements.plist"
          HAS_ENT="false"
          if [ -f "$ENT_FILE" ]; then
            HAS_ENT="$(python3 -c 'import plistlib,sys; d=plistlib.load(open(sys.argv[1],"rb")); print("true" if isinstance(d,dict) and len(d)>0 else "false")' "$ENT_FILE")"
          fi

          if [ "$HAS_ENT" = "true" ]; then
            echo "Applying ad-hoc signature with entitlements: ${ENT_FILE}"
            codesign --force --sign - --timestamp=none --entitlements "$ENT_FILE" "$STAGED_APP"
          else
            echo "Applying clean ad-hoc signature (empty entitlements)"
            codesign --force --sign - --timestamp=none "$STAGED_APP"
          fi

          (cd "$STAGE_DIR" && zip -qry "$IPA_PATH" Payload)
          echo "ipa_path=${IPA_PATH}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"
          echo "staged_app=${STAGED_APP}" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA_PATH"

      - name: Post-Build IPA Verification (arm64 + IOS Platform + MinimumOSVersion <= 16.1)
        env:
          APP_SLUG: ${{ matrix.slug }}
          IPA_PATH: ${{ steps.pkg.outputs.ipa_path }}
          IPA_NAME: ${{ steps.pkg.outputs.ipa_name }}
          STAGED_APP: ${{ steps.pkg.outputs.staged_app }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, plistlib, re, subprocess, sys, zipfile

          ipa_path = pathlib.Path(os.environ["IPA_PATH"])
          staged_app = pathlib.Path(os.environ["STAGED_APP"])

          # 1. ZIP integrity
          with zipfile.ZipFile(ipa_path, "r") as zf:
              bad = zf.testzip()
              if bad is not None:
                  print(f"::error::Corrupt ZIP entry in IPA: {bad}")
                  sys.exit(1)

          # 2. Info.plist, Version Bump Verification & MinimumOSVersion <= 16.1
          info = plistlib.load((staged_app / "Info.plist").open("rb"))
          bundle_id = info.get("CFBundleIdentifier", "unknown")
          exec_name = info.get("CFBundleExecutable", "")
          short_ver = str(info.get("CFBundleShortVersionString", "")).strip()
          bundle_ver = str(info.get("CFBundleVersion", "")).strip()
          min_os = str(info.get("MinimumOSVersion", ""))
          if not short_ver or short_ver == "1.0.0":
              print(f"::error::CFBundleShortVersionString='{short_ver}' must be updated beyond 1.0.0 before packaging IPA!")
              sys.exit(1)
          if not bundle_ver:
              print("::error::Missing CFBundleVersion in packaged Info.plist!")
              sys.exit(1)
          if not exec_name or not (staged_app / exec_name).is_file():
              print(f"::error::Missing CFBundleExecutable '{exec_name}' inside {staged_app}")
              sys.exit(1)

          m = re.match(r"^(\d+)(?:\.(\d+))?(?:\.(\d+))?$", min_os)
          if not m:
              print(f"::error::Missing or invalid MinimumOSVersion in packaged Info.plist: '{min_os}'")
              sys.exit(1)
          ver_tuple = (int(m.group(1)), int(m.group(2) or 0), int(m.group(3) or 0))
          if ver_tuple > (16, 1, 1):
              print(f"::error::MinimumOSVersion={min_os} exceeds iOS 16.1.1 (will NOT install on iPhone XS Max iOS 16.1.1)!")
              sys.exit(1)

          # 3. Mach-O arch (arm64) & platform (IOS, NOT IOSSIMULATOR)
          exec_path = staged_app / exec_name
          lipo_out = subprocess.check_output(["lipo", "-info", str(exec_path)], text=True)
          if "arm64" not in lipo_out or "x86_64" in lipo_out:
              print(f"::error::Unexpected architectures in IPA executable: {lipo_out.strip()}")
              sys.exit(1)

          otool_out = subprocess.check_output(["otool", "-l", str(exec_path)], text=True)
          if "IOSSIMULATOR" in otool_out or re.search(r"\bplatform\s+7\b", otool_out):
              print("::error::Packaged executable targets iOS Simulator (platform 7) instead of iPhoneOS!")
              sys.exit(1)
          if not (re.search(r"\bplatform\s+(?:2|IOS)\b", otool_out) or "LC_VERSION_MIN_IPHONEOS" in otool_out):
              print("::error::Packaged executable does not declare iOS device platform (LC_BUILD_VERSION platform IOS)!")
              sys.exit(1)

          sha = hashlib.sha256(ipa_path.read_bytes()).hexdigest()
          size_mb = ipa_path.stat().st_size / (1024 * 1024)
          print(f"[PASS] Verified IPA: {ipa_path.name} v{short_ver} ({bundle_ver}) ({size_mb:.2f} MiB, SHA-256: {sha})")
          print(f"       Bundle ID: {bundle_id} | MinimumOSVersion: {min_os} | {lipo_out.strip()}")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write(
                      f"\n### Built IPA: `{ipa_path.name}` — `v{short_ver} ({bundle_ver})`\n"
                      f"- **Target Device / OS**: iPhone XS Max (`arm64`, `414×896 @3x`) — iOS 16.1.1\n"
                      f"- **Bundle Identifier**: `{bundle_id}`\n"
                      f"- **Version / Build**: `v{short_ver}` (`{bundle_ver}`)\n"
                      f"- **MinimumOSVersion**: `{min_os}` (verified `<= 16.1.1`)\n"
                      f"- **Mach-O Slice**: `{lipo_out.strip()}` (verified `IOS` device platform)\n"
                      f"- **Size**: `{size_mb:.2f} MiB`\n"
                      f"- **SHA-256**: `{sha}`\n"
                      f"- **Install**: Download artifact → install directly via **TrollStore 2** (recommended on iOS 16.1.1) or **Sideloadly / AltStore / SideStore**.\n"
                  )
          PY

      - name: Publish Direct .ipa to GitHub Release (No .zip Wrapper)
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_SLUG: ${{ matrix.slug }}
          APP_VERSION: ${{ steps.ver.outputs.app_version }}
          APP_BUILD: ${{ steps.ver.outputs.app_build }}
          IPA_PATH: ${{ steps.pkg.outputs.ipa_path }}
          IPA_NAME: ${{ steps.pkg.outputs.ipa_name }}
        run: |
          set -euo pipefail
          TAG="latest-${APP_SLUG}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          REL_TITLE="${APP_SLUG} v${APP_VERSION} (${APP_BUILD}) — Latest iOS 16.1.1 IPA"
          REL_NOTES="Latest unsigned/ad-hoc .ipa build for **${APP_SLUG}** \`v${APP_VERSION} (${APP_BUILD})\` (iOS 16.1.1 / iPhone XS Max) from commit \`${SHORT_SHA}\` (CI run #${GITHUB_RUN_NUMBER})."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_PATH" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$REL_TITLE" --notes "$REL_NOTES"
          else
            gh release create "$TAG" "$IPA_PATH" \
              --title "$REL_TITLE" \
              --notes "$REL_NOTES" \
              --target "$GITHUB_SHA"
          fi
          DIRECT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA_NAME}"
          echo "Direct .ipa URL: ${DIRECT_URL}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "- **Direct .ipa Download (No .zip)**: ${DIRECT_URL}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Unsigned/Ad-Hoc IPA Artifact (Backup)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.slug }}-ios16.1.1-arm64-ipa
          path: ${{ steps.pkg.outputs.ipa_path }}
          retention-days: 30
          if-no-files-found: error
